<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? (부산대편)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }

        /* 3D 애니메이션 관련 CSS를 안전한 페이드인/아웃 방식으로 교체 */
        .card-container {
            position: relative;
            width: 100%;
            height: 16rem; /* h-64 */
        }
        
        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease-in-out;
        }

        .card-front {
            background-color: #6366f1; /* indigo-500 */
            border-radius: 1rem; /* 2xl */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
            z-index: 10; /* 앞면이 기본적으로 위 */
            opacity: 1;
            transform: scale(1);
        }

        .card-back {
            background-image: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem; /* p-6 */
            text-align: center;
            border: 2px solid #e0e7ff; /* indigo-100 */
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); /* shadow-xl */
            z-index: 5;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none; /* 숨겨져 있을 땐 클릭 방지 */
        }

        /* 결과 표시 상태 */
        .show-result .card-front {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
            z-index: 5;
        }

        .show-result .card-back {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            z-index: 10;
        }

        /* 깜빡임 애니메이션 (유지) */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .blinking {
            animation: blink 0.1s infinite;
        }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <header class="bg-white shadow-sm py-6 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black text-indigo-600 tracking-tight">부산대 밥집 룰렛 🍚</h1>
                <p class="text-sm text-gray-500 mt-1 font-medium">오늘 점심 뭐 먹을지 고민될 때!</p>
            </div>
            <button id="add-restaurant-btn" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 py-2 rounded-full font-bold text-sm transition-colors shadow-sm">
                + 내 맛집 추가
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full flex flex-col md:flex-row gap-8">
        
        <!-- 왼쪽: 룰렛 및 결과 영역 -->
        <div class="w-full md:w-1/2 flex flex-col items-center">
            
            <div class="bg-white rounded-3xl shadow-lg p-8 w-full mb-6 relative overflow-hidden flex flex-col items-center justify-center min-h-[350px]">
                
                <!-- 결과 표시 카드 -->
                <div id="result-card" class="card-container cursor-pointer hidden">
                    <!-- 카드 앞면 (물음표 또는 대기 상태) -->
                    <div class="card-face card-front">
                        <span class="text-6xl text-white opacity-50">?</span>
                    </div>
                    <!-- 카드 뒷면 (결과) -->
                    <div class="card-face card-back">
                        <div class="text-sm text-indigo-500 font-bold mb-2">당첨! 🎉</div>
                        <h2 id="result-name" class="text-3xl font-black text-gray-800 mb-2 break-keep"></h2>
                        <div class="flex items-center justify-center text-yellow-400 mb-3" id="rating-container">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                            <span id="result-rating" class="text-gray-600 font-bold ml-1"></span>
                        </div>
                        <p id="result-address" class="text-sm text-gray-500 mb-4 truncate w-full"></p>
                        <a id="result-map-link" href="#" target="_blank" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition-colors w-full">
                            지도에서 보기
                        </a>
                    </div>
                </div>

                <!-- 기본 대기 뷰 -->
                <div id="idle-view" class="flex flex-col items-center justify-center w-full h-full text-center">
                    <div class="w-32 h-32 bg-gray-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
                        <span class="text-5xl">🤔</span>
                    </div>
                    <p class="text-gray-500 font-medium">오른쪽 리스트에서 맛집을 고르거나,<br>아래 버튼을 눌러 랜덤으로 정해보세요!</p>
                </div>
            </div>

            <button id="spin-btn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-black text-xl py-4 px-8 rounded-2xl shadow-lg transform transition hover:-translate-y-1 active:translate-y-0 active:scale-95">
                랜덤 뽑기 START!
            </button>
        </div>

        <!-- 오른쪽: 맛집 리스트 -->
        <div class="w-full md:w-1/2 flex flex-col h-[500px]">
            <div class="flex justify-between items-end mb-4 px-2">
                <h3 class="text-lg font-bold text-gray-700">후보 리스트 <span id="list-count" class="text-indigo-600">5</span></h3>
                <span class="text-xs text-gray-400">항목을 클릭하면 상세 정보를 볼 수 있어요.</span>
            </div>
            
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 flex-grow overflow-hidden flex flex-col">
                <ul id="restaurant-list" class="flex-grow overflow-y-auto p-2">
                    <!-- 리스트 아이템이 JS로 렌더링 됩니다. -->
                </ul>
            </div>
        </div>
    </main>

    <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center px-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-transform scale-95">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800">새로운 밥집 추가</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                <form id="add-form" class="space-y-4">
                    <div>
                        <label for="new-name" class="block text-sm font-medium text-gray-700 mb-1">식당 이름 <span class="text-red-500">*</span></label>
                        <input type="text" id="new-name" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="예: 톤쇼우 부산대점">
                    </div>
                    <div>
                        <label for="new-rating" class="block text-sm font-medium text-gray-700 mb-1">평점</label>
                        <input type="number" id="new-rating" step="0.1" min="0" max="5" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="4.5">
                    </div>
                    <div>
                        <label for="new-address" class="block text-sm font-medium text-gray-700 mb-1">주소</label>
                        <input type="text" id="new-address" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="부산 금정구...">
                    </div>
                    <div>
                        <label for="new-url" class="block text-sm font-medium text-gray-700 mb-1">지도/정보 URL</label>
                        <input type="url" id="new-url" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="https://...">
                    </div>
                    <div class="pt-4 flex gap-3">
                        <button type="button" id="cancel-modal-btn" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 font-medium rounded-xl hover:bg-gray-200 transition-colors">취소</button>
                        <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">추가하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 font-medium text-sm">
        메시지 내용
    </div>

    <script>
        // 초기 부산대 맛집 데이터 (검색 결과 기반)
        let restaurants = [
            {
                id: '1',
                name: '나오리쇼쿠',
                address: '부산광역시 금정구 금강로 271-14',
                rating: 4.6,
                url: 'https://maps.google.com/?cid=12714291278962816525'
            },
            {
                id: '2',
                name: '곁집',
                address: '부산광역시 금정구 금강로 254',
                rating: 4.6,
                url: 'https://maps.google.com/?cid=3769547463163991290'
            },
            {
                id: '3',
                name: '도야지면옥 본점',
                address: '부산광역시 금정구 장전온천천로 39',
                rating: 4.6,
                url: 'https://maps.google.com/?cid=9000973638524335931'
            },
            {
                id: '4',
                name: '수림식당 부산대점',
                address: '부산광역시 금정구 금강로 286',
                rating: 4.4,
                url: 'https://www.instagram.com/surim_kitchen_pnu'
            },
            {
                id: '5',
                name: '안다미로',
                address: '부산광역시 금정구 금강로279번길 8',
                rating: 4.5,
                url: 'https://maps.google.com/?cid=8933796098270831180'
            }
        ];

        // DOM 요소
        const listContainer = document.getElementById('restaurant-list');
        const listCount = document.getElementById('list-count');
        const spinBtn = document.getElementById('spin-btn');
        const idleView = document.getElementById('idle-view');
        const resultCard = document.getElementById('result-card');
        const resultBackFace = document.getElementById('result-back-face');
        const resultName = document.getElementById('result-name');
        const resultRating = document.getElementById('result-rating');
        const ratingContainer = document.getElementById('rating-container');
        const resultAddress = document.getElementById('result-address');
        const resultMapLink = document.getElementById('result-map-link');
        
        // 모달 관련 DOM
        const addModal = document.getElementById('add-modal');
        const addRestaurantBtn = document.getElementById('add-restaurant-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const addForm = document.getElementById('add-form');
        const toast = document.getElementById('toast');

        // 상태 변수
        let isSpinning = false;

        function renderList() {
            listContainer.innerHTML = '';
            listCount.textContent = restaurants.length;

            if (restaurants.length === 0) {
                listContainer.innerHTML = '<li class="p-8 text-center text-gray-400">리스트가 비어있습니다.<br>새로운 맛집을 추가해보세요!</li>';
                return;
            }

            restaurants.forEach((restaurant, index) => {
                const li = document.createElement('li');
                li.className = 'group p-4 border-b border-gray-50 last:border-0 hover:bg-indigo-50/50 cursor-pointer transition-colors flex items-center justify-between rounded-xl mx-2 my-1';
                
                // 식당 정보 표시부
                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex-grow min-w-0 pr-4';
                infoDiv.innerHTML = `
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-bold text-gray-800 truncate">${restaurant.name}</span>
                        ${restaurant.rating ? `<span class="inline-flex items-center text-xs font-semibold text-yellow-600 bg-yellow-100 px-2 py-0.5 rounded-full"><svg class="w-3 h-3 mr-0.5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>${restaurant.rating}</span>` : ''}
                    </div>
                    <p class="text-xs text-gray-500 truncate">${restaurant.address || '주소 정보 없음'}</p>
                `;

                // 리스트 아이템 클릭 시 해당 카드로 보여주기 기능
                infoDiv.onclick = () => showResult(restaurant, false);

                // 삭제 버튼
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'opacity-0 group-hover:opacity-100 p-2 text-gray-400 hover:text-red-500 transition-all rounded-full hover:bg-red-50';
                deleteBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // 카드 보기 이벤트 방지
                    deleteRestaurant(restaurant.id);
                };

                li.appendChild(infoDiv);
                li.appendChild(deleteBtn);
                listContainer.appendChild(li);
            });
        }

        function showToast(message) {
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }

        function deleteRestaurant(id) {
            restaurants = restaurants.filter(r => r.id !== id);
            renderList();
            showToast('목록에서 삭제되었습니다.');
            
            // 삭제한 아이템이 현재 결과 화면에 있다면 초기화
            if(resultCard.dataset.currentId === id) {
                resetView();
            }
        }

        function resetView() {
            resultCard.classList.add('hidden');
            resultCard.classList.remove('show-result');
            idleView.classList.remove('hidden');
            resultCard.dataset.currentId = '';
        }

        function showResult(restaurant, animate = true) {
            if (isSpinning) return;

            idleView.classList.add('hidden');
            resultCard.classList.remove('hidden');
            
            // 데이터 채우기 
            resultName.textContent = restaurant.name;
            
            if (restaurant.rating) {
                resultRating.textContent = restaurant.rating;
                ratingContainer.style.display = 'flex';
            } else {
                resultRating.textContent = '';
                ratingContainer.style.display = 'none';
            }
            
            resultAddress.textContent = restaurant.address || '주소 정보 없음';
            
            if(restaurant.url) {
                resultMapLink.href = restaurant.url;
                resultMapLink.style.display = 'inline-flex';
            } else {
                resultMapLink.style.display = 'none';
            }

            resultCard.dataset.currentId = restaurant.id;

            // 애니메이션 처리
            if(!animate) {
                resultCard.classList.add('show-result');
            } else {
                // 뽑기 시 결과창 숨겼다가 보여주는 연출
                resultCard.classList.remove('show-result');
                setTimeout(() => {
                    resultCard.classList.add('show-result');
                }, 100);
            }
        }

        function spinRoulette() {
            if (isSpinning || restaurants.length === 0) {
                if(restaurants.length === 0) showToast('리스트에 맛집을 먼저 추가해주세요!');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 고르는 중...';
            
            // UI 초기화: 결과를 감추고 앞면(?)이 보이게 함
            idleView.classList.add('hidden');
            resultCard.classList.remove('hidden');
            resultCard.classList.remove('show-result'); 
            
            // 룰렛 효과: 전체 카드 깜빡임
            resultCard.classList.add('blinking');

            // 리스트 롤링 효과
            resultCard.classList.add('blinking');

            // 리스트 하이라이트 효과를 위한 시각적 롤링
            const listItems = listContainer.querySelectorAll('li');
            let rollCount = 0;
            const maxRolls = 20; // 롤링 횟수
            const rollInterval = setInterval(() => {
                listItems.forEach(li => li.classList.remove('bg-indigo-100'));
                if(listItems.length > 0) {
                    const randomIndex = Math.floor(Math.random() * listItems.length);
                    listItems[randomIndex].classList.add('bg-indigo-100');
                }
                
                rollCount++;
                if (rollCount >= maxRolls) {
                    clearInterval(rollInterval);
                    listItems.forEach(li => li.classList.remove('bg-indigo-100')); // 마지막 하이라이트 제거
                    finishSpin();
                }
            }, 80);

            function finishSpin() {
                // 1. 결과 데이터 선택
                const winnerIndex = Math.floor(Math.random() * restaurants.length);
                const winner = restaurants[winnerIndex];
                
                // 2. 깜빡임 효과 제거
                resultCard.classList.remove('blinking');
                
                // !! [치명적 버그 수정] !!
                // 결과를 보여주기 전에 '도는 중' 상태를 먼저 해제해야 showResult 함수가 튕기지 않습니다.
                isSpinning = false;
                
                // 3. showResult 함수를 호출하여 데이터 업데이트 및 카드 뒤집기 애니메이션 실행
                showResult(winner, true); 
                
                // 4. 버튼 상태 복구 및 축하 효과
                spinBtn.disabled = false;
                spinBtn.innerHTML = '다시 뽑기 🔄';
                
                spinBtn.classList.remove('from-indigo-500', 'to-purple-600');
                spinBtn.classList.add('from-green-500', 'to-teal-500');
                
                setTimeout(() => {
                    spinBtn.classList.remove('from-green-500', 'to-teal-500');
                    spinBtn.classList.add('from-indigo-500', 'to-purple-600');
                }, 1000);
            }
        }

        function openModal() {
            addModal.classList.remove('hidden');
            // 애니메이션 딜레이
            setTimeout(() => {
                addModal.querySelector('div').classList.remove('scale-95');
                addModal.querySelector('div').classList.add('scale-100');
            }, 10);
            document.getElementById('new-name').focus();
        }

        function closeModal() {
            addModal.querySelector('div').classList.remove('scale-100');
            addModal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                addModal.classList.add('hidden');
                addForm.reset();
            }, 200); // css transition 시간과 맞춤
        }

        spinBtn.addEventListener('click', spinRoulette);
        
        addRestaurantBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        
        // 모달 바깥 영역 클릭 시 닫기
        addModal.addEventListener('click', (e) => {
            if (e.target === addModal) closeModal();
        });

        // 폼 제출 (새 맛집 추가)
        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('new-name').value.trim();
            const rating = document.getElementById('new-rating').value;
            const address = document.getElementById('new-address').value.trim();
            const url = document.getElementById('new-url').value.trim();

            if (!name) return;

            const newRestaurant = {
                id: Date.now().toString(), // 임시 고유 ID
                name: name,
                rating: rating ? parseFloat(rating) : null,
                address: address,
                url: url
            };

            restaurants.push(newRestaurant);
            renderList();
            closeModal();
            showToast(`'${name}'이(가) 리스트에 추가되었습니다!`);
            
            // 리스트 맨 아래로 스크롤
            setTimeout(() => {
                listContainer.scrollTop = listContainer.scrollHeight;
            }, 100);
        });

        // 초기화 실행
        renderList();

    </script>
</body>
</html>
